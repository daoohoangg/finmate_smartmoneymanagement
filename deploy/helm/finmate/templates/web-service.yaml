apiVersion: v1
kind: Service
metadata:
  name: {{ include "finmate.fullname" . }}-web
  labels:
    {{- include "finmate.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.web.type }}
  ports:
    - port: {{ .Values.service.web.port }}
      targetPort: {{ .Values.service.web.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "finmate.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
