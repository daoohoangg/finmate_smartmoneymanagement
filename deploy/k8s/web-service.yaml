apiVersion: v1
kind: Service
metadata:
  name: finmate-web
  labels:
    app.kubernetes.io/name: finmate
    app.kubernetes.io/component: web
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: finmate
    app.kubernetes.io/component: web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
