name: build-and-deploy

on:
  push:
    branches:
      - main
    paths:
      - finmate_smartmoneymanagement_be/**
      - finmate_smartmoneymanagement_flutter/**
      - deploy/helm/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_NAME }}.azurecr.io
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
  RELEASE_NAME: finmate
  NAMESPACE: finmate
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name $ACR_NAME

      - name: Build and Push API Image
        run: |
          docker build -t $ACR_LOGIN_SERVER/finmate-be:${IMAGE_TAG} -f finmate_smartmoneymanagement_be/Dockerfile finmate_smartmoneymanagement_be
          docker push $ACR_LOGIN_SERVER/finmate-be:${IMAGE_TAG}

      - name: Build and Push Web Image
        run: |
          docker build -t $ACR_LOGIN_SERVER/finmate-web:${IMAGE_TAG} -f finmate_smartmoneymanagement_flutter/Dockerfile finmate_smartmoneymanagement_flutter
          docker push $ACR_LOGIN_SERVER/finmate-web:${IMAGE_TAG}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install $RELEASE_NAME deploy/helm/finmate \
            --namespace $NAMESPACE \
            --create-namespace \
            --set image.api.repository=$ACR_LOGIN_SERVER/finmate-be \
            --set image.api.tag=${IMAGE_TAG} \
            --set image.web.repository=$ACR_LOGIN_SERVER/finmate-web \
            --set image.web.tag=${IMAGE_TAG} \
            --set-string api.secret.data.DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --set-string api.secret.data.CLOUD_API_KEY="${{ secrets.CLOUD_API_KEY }}" \
            --set-string api.secret.data.CLOUD_API_SECRET="${{ secrets.CLOUD_API_SECRET }}" \
            --set-string api.secret.data.JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --set-string api.secret.data.GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
