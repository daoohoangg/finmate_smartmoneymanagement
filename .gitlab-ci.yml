stages:
  - deploy

variables:
  ACR_LOGIN_SERVER: "${ACR_NAME}.azurecr.io"
  RELEASE_NAME: "finmate"
  NAMESPACE: "finmate"
  IMAGE_TAG: "$CI_COMMIT_SHA"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_DRIVER: overlay2

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - finmate_smartmoneymanagement_be/**/*
        - finmate_smartmoneymanagement_flutter/**/*
        - deploy/helm/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

deploy:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:2.60.0
  services:
    - name: docker:24.0.7-dind
      command: ["--tls=false"]
  before_script:
    - apt-get update -y
    - apt-get install -y curl ca-certificates docker.io
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - az aks install-cli
    - |
      if [ -n "$AZURE_CREDENTIALS" ]; then
        eval "$(python - <<'PY'
import json, os
creds = json.loads(os.environ["AZURE_CREDENTIALS"])
print(f'export AZURE_CLIENT_ID="{creds.get("clientId", "")}"')
print(f'export AZURE_CLIENT_SECRET="{creds.get("clientSecret", "")}"')
print(f'export AZURE_TENANT_ID="{creds.get("tenantId", "")}"')
print(f'export AZURE_SUBSCRIPTION_ID="{creds.get("subscriptionId", "")}"')
PY
)"
      fi
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - az acr login --name "$ACR_NAME"
    - |
      docker build -t "$ACR_LOGIN_SERVER/finmate-be:${IMAGE_TAG}" -f finmate_smartmoneymanagement_be/Dockerfile finmate_smartmoneymanagement_be
      docker push "$ACR_LOGIN_SERVER/finmate-be:${IMAGE_TAG}"
    - |
      docker build -t "$ACR_LOGIN_SERVER/finmate-web:${IMAGE_TAG}" -f finmate_smartmoneymanagement_flutter/Dockerfile finmate_smartmoneymanagement_flutter
      docker push "$ACR_LOGIN_SERVER/finmate-web:${IMAGE_TAG}"
    - az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing
    - |
      helm upgrade --install "$RELEASE_NAME" deploy/helm/finmate \
        --namespace "$NAMESPACE" \
        --create-namespace \
        --set image.api.repository="$ACR_LOGIN_SERVER/finmate-be" \
        --set image.api.tag="${IMAGE_TAG}" \
        --set image.web.repository="$ACR_LOGIN_SERVER/finmate-web" \
        --set image.web.tag="${IMAGE_TAG}" \
        --set-string api.secret.data.DB_PASSWORD="$DB_PASSWORD" \
        --set-string api.secret.data.CLOUD_API_KEY="$CLOUD_API_KEY" \
        --set-string api.secret.data.CLOUD_API_SECRET="$CLOUD_API_SECRET" \
        --set-string api.secret.data.JWT_SECRET="$JWT_SECRET" \
        --set-string api.secret.data.GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
