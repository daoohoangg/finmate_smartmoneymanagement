test_flutter:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - finmate_smartmoneymanagement_flutter/**/*
        - deploy/k8s/**/*
        - .gitlab-ci.yml
        - ci/flutter.gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
  script:
    - cd finmate_smartmoneymanagement_flutter
    - flutter --version
    - flutter pub get
    - flutter test

deploy_flutter:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  services:
    - name: docker:24.0.7-dind
      command: ["--tls=false"]
  resource_group: finmate-aks
  variables:
    ACR_LOGIN_SERVER: "${ACR_NAME}.azurecr.io"
    NAMESPACE: "finmate"
    IMAGE_TAG: "$CI_COMMIT_SHA"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_DRIVER: overlay2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - finmate_smartmoneymanagement_flutter/**/*
        - deploy/k8s/**/*
        - .gitlab-ci.yml
        - ci/flutter.gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
  before_script:
    - |
      set -e
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update -y
        apt-get install -y curl ca-certificates docker.io python3 git
      elif command -v tdnf >/dev/null 2>&1; then
        tdnf install -y curl ca-certificates docker-cli tar gzip python3 git
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache curl ca-certificates docker-cli python3 tar gzip git
      fi

      download() {
        url="$1"
        dest="$2"
        if command -v curl >/dev/null 2>&1; then
          curl -fsSL "$url" -o "$dest"
        elif command -v wget >/dev/null 2>&1; then
          wget -qO "$dest" "$url"
        elif command -v python3 >/dev/null 2>&1; then
          python3 -c "import urllib.request; urllib.request.urlretrieve('${url}', '${dest}')"
        else
          echo "No downloader available (curl/wget/python3)."
          exit 1
        fi
      }

      if ! command -v docker >/dev/null 2>&1; then
        tmpdir="$(mktemp -d)"
        download "https://download.docker.com/linux/static/stable/x86_64/docker-24.0.7.tgz" "$tmpdir/docker.tgz"
        tar -xzf "$tmpdir/docker.tgz" -C "$tmpdir"
        install -m 0755 "$tmpdir/docker/docker" /usr/local/bin/docker
      fi

      az aks install-cli

      if [ -n "$AZURE_CREDENTIALS" ]; then
        export AZURE_CLIENT_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("clientId",""))')"
        export AZURE_CLIENT_SECRET="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("clientSecret",""))')"
        export AZURE_TENANT_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("tenantId",""))')"
        export AZURE_SUBSCRIPTION_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("subscriptionId",""))')"
      fi
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - |
      if echo "$ACR_NAME" | grep -q '\.azurecr\.io$'; then
        export ACR_LOGIN_SERVER="$ACR_NAME"
        export ACR_RESOURCE_NAME="${ACR_NAME%%.azurecr.io}"
      else
        export ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"
        export ACR_RESOURCE_NAME="$ACR_NAME"
      fi
    - |
      if [ -n "$ACR_USERNAME" ] && [ -n "$ACR_PASSWORD" ]; then
        echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" -u "$ACR_USERNAME" --password-stdin
      else
        ACR_TOKEN="$(az acr login --name "$ACR_RESOURCE_NAME" --expose-token --output tsv --query accessToken)"
        echo "$ACR_TOKEN" | docker login "$ACR_LOGIN_SERVER" -u 00000000-0000-0000-0000-000000000000 --password-stdin
      fi
    - |
      docker build -t "$ACR_LOGIN_SERVER/finmate-web:${IMAGE_TAG}" -f finmate_smartmoneymanagement_flutter/Dockerfile finmate_smartmoneymanagement_flutter
      docker push "$ACR_LOGIN_SERVER/finmate-web:${IMAGE_TAG}"
    - az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing
    - |
      set -e

      ensure_acr_pull_access() {
        echo "Checking AKS pull access to ACR $ACR_RESOURCE_NAME..."
        if az aks check-acr --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --acr "$ACR_RESOURCE_NAME" --output none >/dev/null 2>&1; then
          echo "AKS pull access to ACR is OK."
          return 0
        fi

        echo "AKS pull access check failed. Attempting AcrPull assignment for kubelet identity..."
        KUBELET_OBJECT_ID="$(az aks show --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --query identityProfile.kubeletidentity.objectId -o tsv 2>/dev/null || true)"
        ACR_ID="$(az acr show --name "$ACR_RESOURCE_NAME" --query id -o tsv 2>/dev/null || true)"

        if [ -n "$KUBELET_OBJECT_ID" ] && [ -n "$ACR_ID" ]; then
          az role assignment create \
            --assignee-object-id "$KUBELET_OBJECT_ID" \
            --assignee-principal-type ServicePrincipal \
            --role AcrPull \
            --scope "$ACR_ID" >/dev/null 2>&1 || true
          echo "Waiting for role propagation..."
          sleep 30
        else
          echo "Unable to resolve kubelet identity or ACR resource id for auto-fix."
        fi

        if az aks check-acr --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --acr "$ACR_RESOURCE_NAME" --output none >/dev/null 2>&1; then
          echo "AKS pull access to ACR verified after role assignment."
          return 0
        fi

        echo "AKS still cannot pull from ACR."
        echo "Manual fix: az aks update --resource-group \"$AKS_RESOURCE_GROUP\" --name \"$AKS_CLUSTER_NAME\" --attach-acr \"$ACR_RESOURCE_NAME\""
        exit 1
      }

      ensure_acr_image_exists() {
        repo="$1"
        tag="$2"
        if [ -z "$tag" ]; then
          echo "Missing image tag for repository $repo."
          exit 1
        fi
        if ! az acr repository show --name "$ACR_RESOURCE_NAME" --image "${repo}:${tag}" --output none >/dev/null 2>&1; then
          echo "Image not found in ACR: $ACR_LOGIN_SERVER/$repo:$tag"
          exit 1
        fi
      }

      ensure_acr_pull_access
      ensure_acr_image_exists "finmate-web" "$IMAGE_TAG"
      kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      WEB_IMAGE="$ACR_LOGIN_SERVER/finmate-web:${IMAGE_TAG}"
      sed "s|__WEB_IMAGE__|${WEB_IMAGE}|g" deploy/k8s/web-deployment.yaml | kubectl apply -n "$NAMESPACE" -f -
      kubectl apply -n "$NAMESPACE" -f deploy/k8s/web-service.yaml
    - |
      kubectl rollout status deployment/finmate-web -n "$NAMESPACE" --timeout=5m
    - |
      for i in $(seq 1 30); do
        WEB_ENDPOINT="$(kubectl get svc finmate-web -n "$NAMESPACE" \
          -o jsonpath='{.status.loadBalancer.ingress[0].ip}{.status.loadBalancer.ingress[0].hostname}')"
        if [ -n "$WEB_ENDPOINT" ]; then
          echo "Flutter web URL: http://$WEB_ENDPOINT"
          exit 0
        fi
        echo "Waiting for external endpoint for service finmate-web ($i/30)..."
        sleep 10
      done
      echo "LoadBalancer endpoint was not assigned in time."
      kubectl get svc finmate-web -n "$NAMESPACE" -o wide
      exit 1
