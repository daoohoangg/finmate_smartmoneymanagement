deploy_flutter:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:2.60.0
  services:
    - name: docker:24.0.7-dind
      command: ["--tls=false"]
  resource_group: finmate-helm
  variables:
    ACR_LOGIN_SERVER: "${ACR_NAME}.azurecr.io"
    RELEASE_NAME: "finmate"
    NAMESPACE: "finmate"
    IMAGE_TAG: "$CI_COMMIT_SHA"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_DRIVER: overlay2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - finmate_smartmoneymanagement_flutter/**/*
        - deploy/helm/**/*
        - .gitlab-ci.yml
        - ci/flutter.gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
  before_script:
    - |
      set -e
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update -y
        apt-get install -y curl ca-certificates docker.io python3
      elif command -v tdnf >/dev/null 2>&1; then
        tdnf install -y curl ca-certificates docker-cli tar gzip python3
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache curl ca-certificates docker-cli python3 tar gzip
      fi

      download() {
        url="$1"
        dest="$2"
        if command -v curl >/dev/null 2>&1; then
          curl -fsSL "$url" -o "$dest"
        elif command -v wget >/dev/null 2>&1; then
          wget -qO "$dest" "$url"
        elif command -v python3 >/dev/null 2>&1; then
          python3 -c "import urllib.request; urllib.request.urlretrieve('${url}', '${dest}')"
        else
          echo "No downloader available (curl/wget/python3)."
          exit 1
        fi
      }

      if ! command -v docker >/dev/null 2>&1; then
        tmpdir="$(mktemp -d)"
        download "https://download.docker.com/linux/static/stable/x86_64/docker-24.0.7.tgz" "$tmpdir/docker.tgz"
        tar -xzf "$tmpdir/docker.tgz" -C "$tmpdir"
        install -m 0755 "$tmpdir/docker/docker" /usr/local/bin/docker
      fi

      if ! command -v helm >/dev/null 2>&1; then
        download "https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3" /tmp/get-helm-3
        chmod +x /tmp/get-helm-3
        /tmp/get-helm-3
      fi

      az aks install-cli

      if [ -n "$AZURE_CREDENTIALS" ]; then
        export AZURE_CLIENT_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("clientId",""))')"
        export AZURE_CLIENT_SECRET="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("clientSecret",""))')"
        export AZURE_TENANT_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("tenantId",""))')"
        export AZURE_SUBSCRIPTION_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("subscriptionId",""))')"
      fi
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - az acr login --name "$ACR_NAME"
    - |
      docker build -t "$ACR_LOGIN_SERVER/finmate-web:${IMAGE_TAG}" -f finmate_smartmoneymanagement_flutter/Dockerfile finmate_smartmoneymanagement_flutter
      docker push "$ACR_LOGIN_SERVER/finmate-web:${IMAGE_TAG}"
    - az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing
    - |
      helm upgrade --install "$RELEASE_NAME" deploy/helm/finmate \
        --namespace "$NAMESPACE" \
        --create-namespace \
        --reuse-values \
        --set image.web.repository="$ACR_LOGIN_SERVER/finmate-web" \
        --set image.web.tag="${IMAGE_TAG}" \
        --set-string api.secret.data.DB_PASSWORD="$DB_PASSWORD" \
        --set-string api.secret.data.CLOUD_API_KEY="$CLOUD_API_KEY" \
        --set-string api.secret.data.CLOUD_API_SECRET="$CLOUD_API_SECRET" \
        --set-string api.secret.data.JWT_SECRET="$JWT_SECRET" \
        --set-string api.secret.data.GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
