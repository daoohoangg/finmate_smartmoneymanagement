test_be:
  stage: test
  image: eclipse-temurin:17-jdk-jammy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - finmate_smartmoneymanagement_be/**/*
        - deploy/k8s/**/*
        - .gitlab-ci.yml
        - ci/be.gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
  script:
    - cd finmate_smartmoneymanagement_be
    - chmod +x ./gradlew
    - ./gradlew --no-daemon test

deploy_be:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  services:
    - name: docker:24.0.7-dind
      command: ["--tls=false"]
  resource_group: finmate-aks
  variables:
    ACR_LOGIN_SERVER: "${ACR_NAME}.azurecr.io"
    NAMESPACE: "finmate"
    IMAGE_TAG: "$CI_COMMIT_SHA"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_DRIVER: overlay2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - finmate_smartmoneymanagement_be/**/*
        - deploy/k8s/**/*
        - .gitlab-ci.yml
        - ci/be.gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
  before_script:
    - |
      set -e
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update -y
        apt-get install -y curl ca-certificates docker.io python3 git
      elif command -v tdnf >/dev/null 2>&1; then
        tdnf install -y curl ca-certificates docker-cli tar gzip python3 git
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache curl ca-certificates docker-cli python3 tar gzip git
      fi

      download() {
        url="$1"
        dest="$2"
        if command -v curl >/dev/null 2>&1; then
          curl -fsSL "$url" -o "$dest"
        elif command -v wget >/dev/null 2>&1; then
          wget -qO "$dest" "$url"
        elif command -v python3 >/dev/null 2>&1; then
          python3 -c "import urllib.request; urllib.request.urlretrieve('${url}', '${dest}')"
        else
          echo "No downloader available (curl/wget/python3)."
          exit 1
        fi
      }

      if ! command -v docker >/dev/null 2>&1; then
        tmpdir="$(mktemp -d)"
        download "https://download.docker.com/linux/static/stable/x86_64/docker-24.0.7.tgz" "$tmpdir/docker.tgz"
        tar -xzf "$tmpdir/docker.tgz" -C "$tmpdir"
        install -m 0755 "$tmpdir/docker/docker" /usr/local/bin/docker
      fi

      # removed az aks install-cli

      if [ -n "$AZURE_CREDENTIALS" ]; then
        export AZURE_CLIENT_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("clientId",""))')"
        export AZURE_CLIENT_SECRET="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("clientSecret",""))')"
        export AZURE_TENANT_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("tenantId",""))')"
        export AZURE_SUBSCRIPTION_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("subscriptionId",""))')"
      fi
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - |
      if echo "$ACR_NAME" | grep -q '\.azurecr\.io$'; then
        export ACR_LOGIN_SERVER="$ACR_NAME"
        export ACR_RESOURCE_NAME="${ACR_NAME%%.azurecr.io}"
      else
        export ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"
        export ACR_RESOURCE_NAME="$ACR_NAME"
      fi
    - |
      if [ -n "$ACR_USERNAME" ] && [ -n "$ACR_PASSWORD" ]; then
        echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" -u "$ACR_USERNAME" --password-stdin
      else
        ACR_TOKEN="$(az acr login --name "$ACR_RESOURCE_NAME" --expose-token --output tsv --query accessToken)"
        echo "$ACR_TOKEN" | docker login "$ACR_LOGIN_SERVER" -u 00000000-0000-0000-0000-000000000000 --password-stdin
      fi
    - |
      docker build -t "$ACR_LOGIN_SERVER/finmate-be:${IMAGE_TAG}" -f finmate_smartmoneymanagement_be/Dockerfile finmate_smartmoneymanagement_be
      docker push "$ACR_LOGIN_SERVER/finmate-be:${IMAGE_TAG}"
    - |
      az webapp config container set --resource-group "$AKS_RESOURCE_GROUP" --name "$WEBAPP_NAME_BE" \
        --docker-custom-image-name "$ACR_LOGIN_SERVER/finmate-be:${IMAGE_TAG}" \
        --docker-registry-server-url "https://$ACR_LOGIN_SERVER"
    - |
      echo "Deployment to Azure App Service ($WEBAPP_NAME_BE) has been triggered."
