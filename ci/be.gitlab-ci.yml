deploy_be:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:2.60.0
  services:
    - name: docker:24.0.7-dind
      command: ["--tls=false"]
  resource_group: finmate-helm
  variables:
    ACR_LOGIN_SERVER: "${ACR_NAME}.azurecr.io"
    RELEASE_NAME: "finmate"
    NAMESPACE: "finmate"
    IMAGE_TAG: "$CI_COMMIT_SHA"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_DRIVER: overlay2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - finmate_smartmoneymanagement_be/**/*
        - deploy/helm/**/*
        - .gitlab-ci.yml
        - ci/be.gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
  before_script:
    - apt-get update -y
    - apt-get install -y curl ca-certificates docker.io python3
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - az aks install-cli
    - |
      if [ -n "$AZURE_CREDENTIALS" ]; then
        export AZURE_CLIENT_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("clientId",""))')"
        export AZURE_CLIENT_SECRET="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("clientSecret",""))')"
        export AZURE_TENANT_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("tenantId",""))')"
        export AZURE_SUBSCRIPTION_ID="$(python3 -c 'import json,os;print(json.loads(os.environ["AZURE_CREDENTIALS"]).get("subscriptionId",""))')"
      fi
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - az acr login --name "$ACR_NAME"
    - |
      docker build -t "$ACR_LOGIN_SERVER/finmate-be:${IMAGE_TAG}" -f finmate_smartmoneymanagement_be/Dockerfile finmate_smartmoneymanagement_be
      docker push "$ACR_LOGIN_SERVER/finmate-be:${IMAGE_TAG}"
    - az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing
    - |
      helm upgrade --install "$RELEASE_NAME" deploy/helm/finmate \
        --namespace "$NAMESPACE" \
        --create-namespace \
        --reuse-values \
        --set image.api.repository="$ACR_LOGIN_SERVER/finmate-be" \
        --set image.api.tag="${IMAGE_TAG}" \
        --set-string api.secret.data.DB_PASSWORD="$DB_PASSWORD" \
        --set-string api.secret.data.CLOUD_API_KEY="$CLOUD_API_KEY" \
        --set-string api.secret.data.CLOUD_API_SECRET="$CLOUD_API_SECRET" \
        --set-string api.secret.data.JWT_SECRET="$JWT_SECRET" \
        --set-string api.secret.data.GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
